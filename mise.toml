[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64"]
python.uv_venv_auto = "source"

[tools]
node = "lts"
pandoc = "latest"
python = "3.14"
uv = "latest"

[tasks.build]
description = "Build the font rendering demo webpage"
run = "./build.sh"

[tasks.clean]
description = "Remove generated files"
run = "rm -rf .build site"

[tasks.install]
description = "Install frontend dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.preview]
description = "Build, watch, and serve the site at http://localhost:3000"
depends = ["build", "install"]
run = "npm run preview"
